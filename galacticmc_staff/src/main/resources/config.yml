staffchat-enabled: []

# Vanished players storage. Each entry is stored as UUID|displayName.
vanished: []

# Muted players storage. Keys are lowercase player names.
# expiry: milliseconds since epoch, use -1 for permanent.
# reason: string explaining the mute.
muted: {}

# Warned players storage. Keys are lowercase player names.
# expiry: milliseconds since epoch, use -1 for permanent.
# reason: string explaining the warning.
warns: {}

# Punishment history storage. Stored per player and loaded on startup.
history: {}