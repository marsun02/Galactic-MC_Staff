name: Galactic-MC_Staff
version: 1.0
main: com.marsun02.plugin.Main
api-version: 1.21
author: Marsun02
commands:
  staff:
    description: Show online staff members and their current world/server
    usage: /<command>
  staffchat:
    description: Toggle Staff Chat mode
    usage: /<command>
  report:
    description: Report a player for rule breaking
    usage: /<command> <player> <reason>
  reporttp:
    description: Teleport to a reported location
    usage: /<command> <world> <x> <y> <z>
  openinv:
    description: Open a player's inventory for moderation
    usage: /<command> <player>
  openender:
    description: Open a player's ender chest for moderation
    usage: /<command> <player>
  vanish:
    description: Toggle vanish mode for staff members
    usage: /<command> [player] | /<command> target <player>
    aliases: [v, v tg]
  tpo:
    description: Teleport to a player while in staff mode
    usage: /<command> <player>
  tpohere:
    description: Teleport a player to you while in staff mode
    usage: /<command> <player>
  tppos:
    description: Teleport to coordinates while in staff mode
    usage: /<command> <x> <y> <z>
  kick:
    description: Kick a player from the server
    usage: /<command> <player> [reason]
  ban:
    description: Ban a player temporarily or permanently
    usage: /<command> <player> [amount] [seconds | minutes | hours | days] [reason]
  unban:
    description: Unban a player
    usage: /<command> <player>
  mute:
    description: Mute a player from public chat
    usage: /<command> <player> [amount] [seconds | minutes | hours | days] [reason]
  unmute:
    description: Unmute a player
    usage: /<command> <player>
  warn:
    description: Warn a player (persists for 7 days)
    usage: /<command> <player> <reason>
  history:
    description: Show a player's punishment history or clear it
    usage: /<command> <player> [page] | /<command> clear <player> [amount]
permissions:
  server.staff.staffmember:
    description: Indicates that the player is a staff member
    default: false
  server.staff.staffchat:
    description: Allows the use of the Staff Chat command
    default: false
  server.staff.staffchat.others:
    description: Allows the use of the Staff Chat command on other players
    default: false
  server.staff.helper:
    description: Helper role
    default: false
  server.staff.mod:
    description: Moderator role
    default: false
  server.staff.admin:
    description: Admin role
    default: false
  server.staff.owner:
    description: Owner role - full permissions
    default: false